<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pencatatan Toko Buah</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-dashboard {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .card-border-left-green { border-left: 5px solid #198754; }
    .card-border-left-blue { border-left: 5px solid #0d6efd; }
    .card-border-left-orange { border-left: 5px solid #fd7e14; }
    .card-border-left-dark { border-left: 5px solid #212529; }
  </style>
</head>
<body class="py-4">

  <div class="container">
    <!-- Header -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-success">Sistem Pencatatan Toko Buah</h2>
      <p class="text-muted">Kelola Penjualan, Pembelian Kulakan, dan Tagihan Piutang</p>
    </div>

    <!-- Ringkasan Dashboard -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card card-dashboard card-border-left-green p-3">
          <small class="text-muted fw-bold">Total Penjualan</small>
          <h4 class="mb-0 fw-bold mt-1" id="totalPenjualanText">Rp 0</h4>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card card-dashboard card-border-left-blue p-3">
          <small class="text-muted fw-bold">Total Pembelian (Kulakan)</small>
          <h4 class="mb-0 fw-bold mt-1" id="totalPembelianText">Rp 0</h4>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card card-dashboard card-border-left-orange p-3">
          <small class="text-muted fw-bold">Total Piutang Belum Bayar</small>
          <h4 class="mb-0 fw-bold mt-1" id="totalPiutangText">Rp 0</h4>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card card-dashboard card-border-left-dark p-3">
          <small class="text-muted fw-bold">Estimasi Keuntungan Kotor</small>
          <h4 class="mb-0 fw-bold mt-1" id="estimasiKeuntunganText">Rp 0</h4>
        </div>
      </div>
    </div>

    <!-- Navigasi Tab (Penjualan / Pembelian) -->
    <div class="d-flex justify-content-center mb-4">
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-success active" id="btnTabPenjualan">Penjualan (Kas Masuk)</button>
        <button type="button" class="btn btn-outline-secondary" id="btnTabPembelian">Pembelian (Kas Keluar)</button>
      </div>
    </div>

    <!-- Form & Tabel Penjualan -->
    <div id="sectionPenjualan">
      <div class="card card-dashboard p-4 mb-4">
        <h5 class="fw-bold mb-3">Catat Penjualan Baru</h5>
        <form id="formPenjualan" class="row g-3">
          <!-- Fitur Baru: Tanggal Penjualan -->
          <div class="col-md-3">
            <label for="tanggalPenjualan" class="form-label">Tanggal*</label>
            <input type="date" class="form-control" id="tanggalPenjualan" required>
          </div>
          <div class="col-md-3">
            <label for="namaPelanggan" class="form-label">Nama Pemesan / Pelanggan*</label>
            <input type="text" class="form-control" id="namaPelanggan" placeholder="Contoh: Bu Rina" required>
          </div>
          <div class="col-md-3">
            <label for="noWa" class="form-label">No. WhatsApp (Opsional)</label>
            <input type="tel" class="form-control" id="noWa" placeholder="081234567890">
          </div>
          <div class="col-md-3">
            <label for="pilihBuah" class="form-label">Pilih Buah*</label>
            <select class="form-select" id="pilihBuah" required>
              <option value="">-- Pilih Buah --</option>
              <option value="Jeruk Squeeze">Jeruk Squeeze</option>
              <option value="Jeruk Peras">Jeruk Peras</option>
              <option value="Jeruk Manis">Jeruk Manis</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="qty" class="form-label">Jumlah / Qty*</label>
            <input type="number" class="form-control" id="qty" min="1" step="any" required>
          </div>
          <div class="col-md-3">
            <label for="satuan" class="form-label">Satuan</label>
            <select class="form-select" id="satuan">
              <option value="Kg">Kg</option>
              <option value="Ikat">Ikat</option>
              <option value="Peti">Peti</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="hargaSatuan" class="form-label">Harga Satuan (Rp)*</label>
            <input type="number" class="form-control" id="hargaSatuan" min="0" required>
          </div>
          <div class="col-md-3">
            <label for="totalHarga" class="form-label">Total Harga (Rp)</label>
            <input type="text" class="form-control bg-light" id="totalHarga" readonly value="Rp 0">
          </div>
          <div class="col-md-3">
            <label for="statusPembayaran" class="form-label">Status Pembayaran*</label>
            <select class="form-select" id="statusPembayaran" required>
              <option value="Lunas">Lunas</option>
              <option value="Belum Bayar">Belum Bayar (Piutang)</option>
            </select>
          </div>
          <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Simpan Penjualan</button>
          </div>
        </form>
      </div>

      <!-- Riwayat Penjualan -->
      <div class="card card-dashboard p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">Riwayat Penjualan</h5>
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-dark active" onclick="filterPenjualan('semua')">Semua</button>
            <button type="button" class="btn btn-outline-secondary" onclick="filterPenjualan('Lunas')">Lunas</button>
            <button type="button" class="btn btn-outline-secondary" onclick="filterPenjualan('Belum Bayar')">Belum Bayar (Piutang)</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Tanggal</th>
                <th>Pelanggan</th>
                <th>Buah</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelRiwayatPenjualan">
              <!-- Data dimasukkan via Javascript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
